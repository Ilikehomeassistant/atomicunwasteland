<!DOCTYPE html>
<html>
  <head>

    <meta charset="UTF-8">
    <title>atomicunwasteland // blog</title>
    <link rel="icon" type="image/jpeg" href="https://atomicunwasteland.neocities.org/icons/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        font-family: Verdana, Geneva, sans-serif;
        color: #111;
      }

      .page-bg {
        background-image: url('https://frutigeraeroarchive.org/images/introduction/thumbnails/asadal.jpg');
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center top;
        background-attachment: fixed;
        min-height: 100vh;
        padding: 10px;
        box-sizing: border-box;
      }

      .win98-window {
        max-width: 700px;
        margin: 10px auto;
        background: #c0c0c0;
        padding: 3px;
        box-shadow:
          inset -1px -1px 0 #0a0a0a,
          inset 1px 1px 0 #fff,
          inset -2px -2px 0 #808080,
          inset 2px 2px 0 #dfdfdf;
        font-family: Tahoma, "MS Sans Serif", Geneva, sans-serif;
      }

      .win98-titlebar {
        background: linear-gradient(90deg, #000080, #1084d0);
        color: #fff;
        font-family: Tahoma, "MS Sans Serif", Geneva, sans-serif;
        font-weight: bold;
        font-size: 13px;
        padding: 3px 3px 3px 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2px;
      }
      .win98-titlebar .win98-title {
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .win98-titlebar-btns { display: flex; gap: 2px; }
      .win98-btn {
        width: 16px;
        height: 14px;
        background: #c0c0c0;
        box-shadow:
          inset -1px -1px 0 #0a0a0a,
          inset 1px 1px 0 #fff,
          inset -2px -2px 0 #808080,
          inset 2px 2px 0 #dfdfdf;
        font-family: "Marlett", Tahoma, sans-serif;
        font-size: 10px;
        line-height: 12px;
        color: #000;
        text-align: center;
        cursor: default;
        user-select: none;
      }

      .win98-menubar {
        display: flex;
        gap: 14px;
        font-size: 12px;
        padding: 3px 8px;
        border-bottom: 1px solid #808080;
        box-shadow: 0 1px 0 #fff;
        margin-bottom: 4px;
      }
      .win98-menubar span { cursor: default; }
      .win98-menubar span:first-letter { text-decoration: underline; }

      .back-link {
        font-size: 11px;
        padding: 4px 8px 0;
        margin: 0 4px;
      }
      .back-link a { color: #0a3d6b; text-decoration: none; }
      .back-link a:hover { text-decoration: underline; }

      .mail-body {
        display: flex;
        min-height: 320px;
        margin: 6px 4px 0;
      }
      .mail-list {
        width: 220px;
        flex-shrink: 0;
        background: #fff;
        box-shadow: inset -1px -1px 0 #fff, inset 1px 1px 0 #808080;
        overflow-y: auto;
      }
      .mail-item {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        font-size: 12px;
        cursor: pointer;
        border-bottom: 1px solid #d8d8c8;
      }
      .mail-item:hover { background: #e8e8e8; }
      .mail-item.selected { background: #000080; color: #fff; }
      .mail-item img { width: 16px; height: 16px; flex-shrink: 0; }
      .mail-item .meta { display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
      .mail-item .meta .t {
        font-weight: bold;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mail-item .meta .d { font-size: 10px; color: #555; }
      .mail-item.selected .meta .d { color: #cfd8ff; }

      .mail-reading {
        flex: 1;
        min-width: 0;
        background: #fdfdf0;
        box-shadow: inset -1px -1px 0 #fff, inset 1px 1px 0 #808080;
        padding: 14px 18px;
        overflow-y: auto;
        font-size: 13px;
        margin-left: 4px;
      }
      .mail-reading h3 {
        margin-top: 0;
        font-family: 'VT323', monospace;
        color: #0a3d6b;
        font-size: 1.7rem;
      }
      .mail-reading .post-date { font-size: 11px; color: #666; margin-bottom: 10px; }
      .mail-reading p { line-height: 1.5; }

      .win98-statusbar {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: #000;
        margin: 6px 4px 2px;
        padding: 2px 6px;
        box-shadow: inset -1px -1px 0 #fff, inset 1px 1px 0 #808080;
      }

      @media (max-width: 640px) {
        .mail-body { flex-direction: column; }
        .mail-list { width: 100%; max-height: 160px; }
        .mail-reading { margin-left: 0; margin-top: 4px; }
      }
    </style>
  </head>
  <body>
    <div class="page-bg">
      <div class="win98-window">
        <div class="win98-titlebar">
          <span class="win98-title">
            <img src="https://win98icons.alexmeub.com/icons/png/msn_cool-4.png" alt="" style="width:16px;height:16px;" onerror="this.style.display='none'">
            blog.html - Outlook Express
          </span>
          <div class="win98-titlebar-btns">
            <div class="win98-btn">_</div>
            <div class="win98-btn">&#9633;</div>
            <div class="win98-btn">X</div>
          </div>
        </div>
        <div class="win98-menubar">
          <span>File</span>
          <span>Edit</span>
          <span>View</span>
          <span>Tools</span>
          <span>Message</span>
          <span>Help</span>
        </div>

        <div class="back-link">
          <a href="/">&laquo;&laquo; back to atomicunwasteland</a>
        </div>

        <div class="mail-body">
          <div class="mail-list" id="mailList"></div>
          <div class="mail-reading" id="mailReading"></div>
        </div>

        <div class="win98-statusbar">
          <span id="postCount">0 message(s)</span>
          <span id="lastUpdated"></span>
        </div>
      </div>
    </div>

    <script>
      var listEl = document.getElementById('mailList');
      var readingEl = document.getElementById('mailReading');
      var posts = [];

      function renderList() {
        listEl.innerHTML = '';
        posts.forEach(function(p) {
          var row = document.createElement('div');
          row.className = 'mail-item';
          row.dataset.id = p.id;
          row.innerHTML =
            '<img src="' + p.icon + '" alt="" onerror="this.style.display=\'none\'">' +
            '<div class="meta"><span class="t">' + p.title + '</span><span class="d">' + p.date + '</span></div>';
          row.addEventListener('click', function() { selectPost(p.id); });
          listEl.appendChild(row);
        });
      }

      function selectPost(id) {
        var post = posts.find(function(p) { return p.id === id; });
        if (!post) return;

        Array.prototype.forEach.call(listEl.children, function(row) {
          row.classList.toggle('selected', parseInt(row.dataset.id, 10) === id);
        });

        readingEl.innerHTML =
          '<h3>' + post.title + '</h3>' +
          '<div class="post-date">' + post.date + '</div>' +
          post.body;
      }

      fetch('/posts.json')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          posts = data;
          renderList();
          var wantedId = parseInt(new URLSearchParams(location.search).get('post'), 10);
          var initial = posts.find(function(p) { return p.id === wantedId; }) || posts[0];
          if (initial) selectPost(initial.id);
          document.getElementById('postCount').textContent = posts.length + ' message(s)';
        })
        .catch(function() {
          readingEl.innerHTML = '<p>couldn\'t load posts right now, sorry!</p>';
        });

      document.getElementById('lastUpdated').textContent =
        'last updated: ' + new Date().toLocaleDateString();
    </script>
  </body>
</html>
