<body>
  <div id="__bundler_placeholder">Loading Pickled Tomato Dust...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 style=\"margin: 28px 0 0; max-width: 620px; font-size: 17px; color: #D4CBB8\">We do not stop breaches. We cure them, grind them down and sprinkle them over your network until nobody can tell what went wrong.<\u002Fp>\n<div style=\"margin-top: 40px; display: flex; flex-wrap: wrap; gap: 16px\">\n<a href=\"#contact\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 28px; background: {{accent}}; color: #0F1A14; font-weight: 700; border-radius: 4px\">Book a brining<\u002Fa>\n<a href=\"#solutions\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 28px; border: 1px solid #F1E9D8; border-radius: 4px\">See solutions<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"border-top: 1px solid #2A3B30; border-bottom: 1px solid #2A3B30; background: #14231A\">\n<div style=\"max-width: 1180px; margin: 0 auto; padding: 14px 32px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 12px 40px; font-size: 13px; color: #A9B8A3\">\n<span>THREAT LEVEL: MILDLY TANGY<\u002Fspan>\n<span>PICKLE INTEGRITY: NOMINAL<\u002Fspan>\n<span>DUST PARTICLES IN SUSPENSION: YES<\u002Fspan>\n<span>LAST BREACH: PROBABLY LUNCH<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width: 1180px; margin: 0 auto; padding: 72px 32px 8px; box-sizing: border-box\">\n<div style=\"font-size: 13px; color: #8DBF5A; font-weight: 700; letter-spacing: 0.12em; margin-bottom: 32px\">[ OUR NUMBERS (WE CHECKED THEM TWICE, ONCE BY EYE) ]<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 32px\">\n<div>\n<div style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 64px; line-height: 1; color: {{accent}}\">100%<\u002Fdiv>\n<p style=\"margin: 8px 0 0; color: #D4CBB8\">of breaches we failed to detect did not, as far as we know, happen.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 64px; line-height: 1; color: {{accent}}\">0<\u002Fdiv>\n<p style=\"margin: 8px 0 0; color: #D4CBB8\">known incidents since we stopped keeping the incident log.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 64px; line-height: 1; color: {{accent}}\">After lunch<\u002Fdiv>\n<p style=\"margin: 8px 0 0; color: #D4CBB8\">mean time to respond, subject to lunch.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 64px; line-height: 1; color: {{accent}}\">9 of 10<\u002Fdiv>\n<p style=\"margin: 8px 0 0; color: #D4CBB8\">auditors agreed to stop asking questions after the free sample.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 48px; padding-top: 24px; border-top: 1px solid #2A3B30; display: flex; flex-wrap: wrap; gap: 12px 32px; font-size: 13px; color: #A9B8A3\">\n<span>AS FEATURED IN:<\u002Fspan>\n<span>Jar Weekly<\u002Fspan>\n<span>The Daily Brine<\u002Fspan>\n<span>Condiment Security Quarterly<\u002Fspan>\n<span>A napkin someone left on a table<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-top: 72px; border-top: 1px solid #2A3B30; border-bottom: 1px solid #2A3B30; background: #14231A; padding: 20px 0 16px\">\n<div style=\"max-width: 1180px; margin: 0 auto 14px; padding: 0 32px; box-sizing: border-box; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: #8DBF5A\">[ OUR PARTNERS ]<\u002Fdiv>\n<div style=\"overflow: hidden; width: 100%\">\n<div class=\"ptd-marquee\" style=\"display: flex; width: max-content; animation: ptd-marquee 36s linear infinite\">\n<div style=\"display: flex; flex-shrink: 0; white-space: nowrap; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; color: #F1E9D8\">\n<span style=\"margin-right: 56px\">SWEET CHESTNUT FRUIT CAKE LTD*<\u002Fspan>\n<span style=\"margin-right: 56px; color: #FF5A3C\">◆<\u002Fspan>\n<span style=\"margin-right: 56px\">SWEET CHESTNUT FRUIT CAKE LTD*<\u002Fspan>\n<span style=\"margin-right: 56px; color: #FF5A3C\">◆<\u002Fspan>\n<span style=\"margin-right: 56px\">SWEET CHESTNUT FRUIT CAKE LTD*<\u002Fspan>\n<span style=\"margin-right: 56px; color: #FF5A3C\">◆<\u002Fspan>\n<span style=\"margin-right: 56px\">SWEET CHESTNUT FRUIT CAKE LTD*<\u002Fspan>\n<span style=\"margin-right: 56px; color: #FF5A3C\">◆<\u002Fspan>\n<\u002Fdiv>\n<div aria-hidden=\"true\" style=\"display: flex; flex-shrink: 0; white-space: nowrap; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; color: #F1E9D8\">\n<span style=\"margin-right: 56px\">SWEET CHESTNUT FRUIT CAKE LTD*<\u002Fspan>\n<span style=\"margin-right: 56px; color: #FF5A3C\">◆<\u002Fspan>\n<span style=\"margin-right: 56px\">SWEET CHESTNUT FRUIT CAKE LTD*<\u002Fspan>\n<span style=\"margin-right: 56px; color: #FF5A3C\">◆<\u002Fspan>\n<span style=\"margin-right: 56px\">SWEET CHESTNUT FRUIT CAKE LTD*<\u002Fspan>\n<span style=\"margin-right: 56px; color: #FF5A3C\">◆<\u002Fspan>\n<span style=\"margin-right: 56px\">SWEET CHESTNUT FRUIT CAKE LTD*<\u002Fspan>\n<span style=\"margin-right: 56px; color: #FF5A3C\">◆<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"max-width: 1180px; margin: 14px auto 0; padding: 0 32px; box-sizing: border-box; font-size: 13px; color: #A9B8A3\">* Sweet Chestnut Fruit Cake Ltd is a subsidiary of PTD.<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"solutions\" style=\"max-width: 1180px; margin: 0 auto; padding: 72px 32px 24px; box-sizing: border-box\">\n<h3 style=\"margin: 0 0 40px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 500; font-size: 28px; color: #8DBF5A\">solutions include:<\u002Fh3>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px\">\n\n<div style=\"padding: 32px; border: 1px solid #2A3B30; border-radius: 8px; background: #14231A; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"font-size: 13px; color: #8DBF5A; font-weight: 700\">01 / DECEPTION<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1\">PTD-Pit honeypot<\u002Fh3>\n<p style=\"margin: 0; color: #D4CBB8\">A fake network so appetizing that attackers forget why they came. Every login attempt is logged, jarred and labelled with a handwritten date.<\u002Fp>\n<div style=\"margin-top: auto; padding-top: 12px; font-size: 13px; color: #A9B8A3\">Contents may settle during transit.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding: 32px; border: 1px solid #2A3B30; border-radius: 8px; background: #14231A; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"font-size: 13px; color: #8DBF5A; font-weight: 700\">02 / OPERATING SYSTEM<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1\">FS food oS for maximal food consumption<\u002Fh3>\n<p style=\"margin: 0; color: #D4CBB8\">A hardened operating system with one kernel-level priority: snacks. Scheduler, filesystem and firewall all yield to a sandwich.<\u002Fp>\n<div style=\"margin-top: auto; padding-top: 12px; font-size: 13px; color: #A9B8A3\">Boots faster than you can say second helping.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding: 32px; border: 1px solid #2A3B30; border-radius: 8px; background: #14231A; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"font-size: 13px; color: #8DBF5A; font-weight: 700\">03 / HOSPITALITY<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1\">Hotel management Xmony<\u002Fh3>\n<p style=\"margin: 0; color: #D4CBB8\">Run every room, key card and breakfast buffet from one dashboard. Guests check in, threats check out, and the minibar stays encrypted.<\u002Fp>\n<div style=\"margin-top: auto; padding-top: 12px; font-size: 13px; color: #A9B8A3\">Late checkout available for malware.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding: 32px; border: 1px solid #2A3B30; border-radius: 8px; background: #14231A; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"font-size: 13px; color: #8DBF5A; font-weight: 700\">04 / PERIMETER<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1\">PTD SaltWall firewall<\u002Fh3>\n<p style=\"margin: 0; color: #D4CBB8\">A firewall made of actual salt. Packets that touch it shrivel and leave. Not recommended for use near slugs.<\u002Fp>\n<div style=\"margin-top: auto; padding-top: 12px; font-size: 13px; color: #A9B8A3\">Humidity may void protection.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding: 32px; border: 1px solid #2A3B30; border-radius: 8px; background: #14231A; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"font-size: 13px; color: #8DBF5A; font-weight: 700\">05 / ZERO TRUST<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1\">Cucumber Zero Trust<\u002Fh3>\n<p style=\"margin: 0; color: #D4CBB8\">Trust no user, no device and especially no cucumber. Every request is verified, brined and then verified again for flavour.<\u002Fp>\n<div style=\"margin-top: auto; padding-top: 12px; font-size: 13px; color: #A9B8A3\">Cucumbers were not consulted.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding: 32px; border: 1px solid #2A3B30; border-radius: 8px; background: #14231A; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"font-size: 13px; color: #8DBF5A; font-weight: 700\">06 / MONITORING<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1\">KaaS: Ketchup-as-a-Service<\u002Fh3>\n<p style=\"margin: 0; color: #D4CBB8\">A SIEM that squeezes your logs onto one plate. Alerts arrive in a bottle you must shake aggressively before reading.<\u002Fp>\n<div style=\"margin-top: auto; padding-top: 12px; font-size: 13px; color: #A9B8A3\">Pairs well with fries and compliance.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding: 32px; border: 1px solid #2A3B30; border-radius: 8px; background: #14231A; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"font-size: 13px; color: #8DBF5A; font-weight: 700\">07 / ENDPOINT<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1\">Antivirus Sourdough<\u002Fh3>\n<p style=\"margin: 0; color: #D4CBB8\">Scans your machines overnight, rises by morning, and sheds a faint smell of yeast on every detected threat.<\u002Fp>\n<div style=\"margin-top: auto; padding-top: 12px; font-size: 13px; color: #A9B8A3\">Starter culture sold separately.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding: 32px; border: 1px solid #2A3B30; border-radius: 8px; background: #14231A; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"font-size: 13px; color: #8DBF5A; font-weight: 700\">08 / IDENTITY<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1\">Two-Factor Gherkin<\u002Fh3>\n<p style=\"margin: 0; color: #D4CBB8\">Authenticate with a password and a small pickle. Lose the pickle and you must prove you are who you say you are, loudly, to a receptionist.<\u002Fp>\n<div style=\"margin-top: auto; padding-top: 12px; font-size: 13px; color: #A9B8A3\">Biometric option: a sniff test.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding: 32px; border: 1px solid #2A3B30; border-radius: 8px; background: #14231A; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"font-size: 13px; color: #8DBF5A; font-weight: 700\">09 / INCIDENT RESPONSE<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1\">The Emergency Ladle<\u002Fh3>\n<p style=\"margin: 0; color: #D4CBB8\">Break glass in case of ransomware. Inside is a ladle. We cannot explain what happens next, but morale improves.<\u002Fp>\n<div style=\"margin-top: auto; padding-top: 12px; font-size: 13px; color: #A9B8A3\">Soup not included.<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"method\" style=\"max-width: 1180px; margin: 0 auto; padding: 96px 32px; box-sizing: border-box\">\n<h2 style=\"margin: 0 0 48px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(32px, 5vw, 56px); line-height: 1; letter-spacing: -0.01em\">The PTD method<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 40px\">\n<div style=\"border-top: 3px solid {{accent}}; padding-top: 20px\">\n<div style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px\">1. Brine<\u002Fdiv>\n<p style=\"margin: 12px 0 0; color: #D4CBB8\">Submerge your infrastructure in a proprietary vinegar-based threat model for no fewer than six weeks.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border-top: 3px solid {{accent}}; padding-top: 20px\">\n<div style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px\">2. Dust<\u002Fdiv>\n<p style=\"margin: 12px 0 0; color: #D4CBB8\">Dehydrate, pulverize, and apply evenly across all endpoints. Coverage is measured in pinches.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border-top: 3px solid {{accent}}; padding-top: 20px\">\n<div style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px\">3. Defend<\u002Fdiv>\n<p style=\"margin: 12px 0 0; color: #D4CBB8\">Attackers sneeze, lose their place, and go home. Our incident response is a polite shrug.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"ptd-scene\" style=\"position: relative; height: 2980px; border-top: 1px solid #2A3B30; border-radius: 4px; width: 1300px\">\n<div style=\"position: sticky; top: 0; height: 680px; box-sizing: border-box; padding: 0 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #0F1A14; overflow: hidden\">\n\n<div style=\"width: 100%; max-width: 880px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.1\">Live demo: defending a server<\u002Fh2>\n<span style=\"font-size: 13px; color: {{accent}}; opacity: {{hintO}}\">scroll to pour ↓<\u002Fspan>\n<\u002Fdiv>\n\n<div style=\"position: relative; width: 100%; max-width: 880px; aspect-ratio: 1000 / 560\">\n<svg sc-camel-view-box=\"0 0 1000 560\" role=\"img\" aria-label=\"Animation: a jar of pale red dust opens and is poured over a server while hackers are flung away at ridiculous speed\" style=\"position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block\">\n<defs>\n<linearGradient id=\"ptd-coat\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n<stop offset=\"0\" stop-color=\"#E8A090\" stop-opacity=\"1\"><\u002Fstop>\n<stop offset=\"1\" stop-color=\"#E8A090\" stop-opacity=\"0.15\"><\u002Fstop>\n<\u002FlinearGradient>\n<g id=\"ptd-hk\">\n<path d=\"M -18 0 L -14 -50 Q 0 -74 14 -50 L 18 0 Z\" fill=\"#050806\" stroke=\"#8DBF5A\" stroke-width=\"2\"><\u002Fpath>\n<rect x=\"-8\" y=\"-58\" width=\"5\" height=\"4\" fill=\"#8DBF5A\"><\u002Frect>\n<rect x=\"3\" y=\"-58\" width=\"5\" height=\"4\" fill=\"#8DBF5A\"><\u002Frect>\n<rect x=\"14\" y=\"-34\" width=\"30\" height=\"20\" rx=\"2\" fill=\"#14231A\" stroke=\"#8DBF5A\" stroke-width=\"2\"><\u002Frect>\n<rect x=\"20\" y=\"-29\" width=\"18\" height=\"2\" fill=\"#8DBF5A\"><\u002Frect>\n<rect x=\"20\" y=\"-24\" width=\"12\" height=\"2\" fill=\"#8DBF5A\"><\u002Frect>\n<\u002Fg>\n<g id=\"ptd-trail\">\n<line x1=\"34\" y1=\"-52\" x2=\"120\" y2=\"-52\" stroke=\"#F1E9D8\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fline>\n<line x1=\"34\" y1=\"-32\" x2 " height=\"200\" rx=\"8\" fill=\"url(#ptd-coat)\" style=\"opacity: {{coatO}}\"><\u002Frect>\n<ellipse cx=\"0\" cy=\"0\" rx=\"72\" ry=\"16\" fill=\"#E8A090\" style=\"transform: {{moundT}}; opacity: {{moundO}}\"><\u002Fellipse>\n\n<use href=\"#ptd-trail\" style=\"transform: {{h0t}}; opacity: {{h0o}}\"><\u002Fuse>\n<use href=\"#ptd-trail\" style=\"transform: {{h1t}}; opacity: {{h1o}}\"><\u002Fuse>\n<use href=\"#ptd-trail\" style=\"transform: {{h2t}}; opacity: {{h2o}}\"><\u002Fuse>\n<use href=\"#ptd-trail\" style=\"transform: {{h3t}}; opacity: {{h3o}}\"><\u002Fuse>\n<use href=\"#ptd-hk\" style=\"transform: {{h0b}}\"><\u002Fuse>\n<use href=\"#ptd-hk\" style=\"transform: {{h1b}}\"><\u002Fuse>\n<use href=\"#ptd-hk\" style=\"transform: {{h2b}}\"><\u002Fuse>\n<use href=\"#ptd-hk\" style=\"transform: {{h3b}}\"><\u002Fuse>\n\n<g style=\"transform: {{jarT}}\">\n<rect x=\"-55\" y=\"-70\" width=\"110\" height=\"140\" rx=\"16\" fill=\"rgba(241,233,216,0.10)\" stroke=\"#F1E9D8\" stroke-width=\"3\"><\u002Frect>\n<rect x=\"-48\" y=\"-62\" width=\"96\" height=\"124\" rx=\"10\" fill=\"#E8A090\" style=\"transform: {{jarFillT}}; transform-box: fill-box; transform-origin: 50% 100%\"><\u002Frect>\n<rect x=\"-46\" y=\"-90\" width=\"92\" height=\"22\" rx=\"4\" fill=\"rgba(241,233,216,0.10)\" stroke=\"#F1E9D8\" stroke-width=\"3\"><\u002Frect>\n<rect x=\"-34\" y=\"-22\" width=\"68\" height=\"40\" rx=\"4\" fill=\"#F1E9D8\"><\u002Frect>\n<text x=\"0\" y=\"2\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"#0F1A14\" font-family=\"JetBrains Mono, monospace\">PTD<\u002Ftext>\n<text x=\"0\" y=\"14\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#0F1A14\" font-family=\"JetBrains Mono, monospace\">DUST<\u002Ftext>\n<\u002Fg>\n<g style=\"transform: {{lidT}}\">\n<rect x=\"-50\" y=\"-9\" width=\"100\" height=\"18\" rx=\"4\" fill=\"#FF5A3C\"><\u002Frect>\n<\u002Fg>\n\n<g style=\"transform: {{stampT}}; opacity: {{stampO}}\">\n<rect x=\"-120\" y=\"-26\" width=\"240\" height=\"52\" rx=\"4\" fill=\"#0F1A14\" stroke=\"#FF5A3C\" stroke-width=\"4\"><\u002Frect>\n<text x=\"0\" y=\"8\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#FF5A3C\" font-family=\"JetBrains Mono, monospace\">ACCESS DENIED<\u002Ftext>\n<\u002Fg>\n<\u002Fsvg>\n\n<div style=\"position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none\">\n<sc-for list=\"{{particles}}\" as=\"d\" hint-placeholder-count=\"3\">\n<div style=\"position: absolute; left: {{d.left}}; top: {{d.top}}; width: {{d.size}}; height: {{d.size}}; margin: 0; border-radius: 50%; background: #E8A090; opacity: {{d.opacity}}; filter: {{d.filter}}; transform: translate(-50%, -50%)\"><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"width: 100%; max-width: 880px\">\n<div style=\"font-size: 13px; font-weight: 700; color: #8DBF5A\">{{stage}}<\u002Fdiv>\n<div style=\"margin-top: 4px; font-size: 16px; color: #D4CBB8; min-height: 52px\">{{caption}}<\u002Fdiv>\n<div style=\"margin-top: 8px; height: 3px; background: #2A3B30\"><div style=\"height: 3px; background: {{accent}}; width: {{barW}}\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background: #14231A; border-top: 1px solid #2A3B30; border-bottom: 1px solid #2A3B30\">\n<div style=\"max-width: 1180px; margin: 0 auto; padding: 88px 32px; box-sizing: border-box\">\n<h2 style=\"margin: 0 0 12px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(32px, 5vw, 56px); line-height: 1; letter-spacing: -0.01em\">Feedback from entities that cannot sue<\u002Fh2>\n<p style=\"margin: 0 0 48px; color: #A9B8A3\">Invented for this page. Any resemblance to a satisfied customer is a coincidence.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px\">\n<div style=\"padding: 28px; border: 1px solid #2A3B30; border-radius: 8px; background: #0F1A14\">\n<p style=\"margin: 0; font-size: 17px; color: #F1E9D8\">We were hacked for years and never noticed. Then PTD arrived and now we notice a faint tang.<\u002Fp>\n<div style=\"margin-top: 20px; font-size: 13px; color: #8DBF5A\">A cucumber, Head of Security, Cucumber Holdings<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 28px; border: 1px solid #2A3B30; border-radius: 8px; background: #0F1A14\">\n<p style=\"margin: 0; font-size: 17px; color: #F1E9D8\">I asked for a penetration test and received a pickle. Honestly, it found everything.<\u002Fp>\n<div style=\"margin-top: 20px; font-size: 13px; color: #8DBF5A\">A hotel manager, who prefers to remain a raccoon<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 28px; border: 1px solid #2A3B30; border-radius: 8px; background: #0F1A14\">\n<p style=\"margin: 0; font-size: 17px; color: #F1E9D8\">Our compliance officer wept openly during the demo. We assume it was joy.<\u002Fp>\n<div style=\"margin-top: 20px; font-size: 13px; color: #8DBF5A\">Gerald, certified by Gerald<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width: 1180px; margin: 0 auto; padding: 96px 32px; box-sizing: border-box\">\n<h2 style=\"margin: 0 0 40px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(32px, 5vw, 56px); line-height: 1; letter-spacing: -0.01em\">Questions people ask us<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px 48px\">\n<div>\n<div style=\"font-weight: 700; color: {{accent}}\">Is it secure?<\u002Fdiv>\n<p style=\"margin: 8px 0 0; color: #D4CBB8\">Define secure. Define is. Please stop asking.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-weight: 700; color: {{accent}}\">Do you support cloud environments?<\u002Fdiv>\n<p style=\"margin: 8px 0 0; color: #D4CBB8\">We support all weather conditions, including partial cloud, light drizzle and brine.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-weight: 700; color: {{accent}}\">Why is the dust pickled?<\u002Fdiv>\n<p style=\"margin: 8px 0 0; color: #D4CBB8\">Fresh dust has a short shelf life and poor compliance posture.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-weight: 700; color: {{accent}}\">Who is your CISO?<\u002Fdiv>\n<p style=\"margin: 8px 0 0; color: #D4CBB8\">A jar on the third shelf. It has never once been phished.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"contact\" style=\"background: {{accent}}; color: #0F1A14\">\n<div style=\"max-width: 1180px; margin: 0 auto; padding: 72px 32px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 32px; align-items: center; justify-content: space-between\">\n<div style=\"max-width: 640px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(30px, 4.4vw, 52px); line-height: 1.02\">Your network called. It wants seasoning.<\u002Fh2>\n<p style=\"margin: 16px 0 0; font-size: 16px\">Talk to a representative who is definitely not a raccoon in a suit.<\u002Fp>\n<\u002Fdiv>\n<a href=\"#contact\" style=\"display: inline-flex; align-items: center; min-height: 52px; padding: 0 32px; background: #0F1A14; color: #F1E9D8; font-weight: 700; border-radius: 4px\">Request a demo<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width: 1180px; margin: 0 auto; padding: 40px 32px 56px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; font-size: 13px; color: #A9B8A3\">\n<span>Pickled Tomato Dust. A fictional company. Please do not rely on it to protect anything.<\u002Fspan>\n<span>Satire. No tomatoes were secured in the making of this page.<\u002Fspan>\n<span style=\"flex-basis: 100%\">Fine print: PTD makes no guarantees, warranties or promises, and wishes you a pleasant afternoon. Results may vary, spoil or be sold at a farmers market. Terms and conditions are written on the underside of a lid.<\u002Fspan>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<sc-if data-dc-static=\"\" value=\"{{ false }}\"><style>x-dc>*{display:none!important}x-dc>[data-dc-static]{display:block!important}<\u002Fstyle>\n\n<div style=\"width: 100%; box-sizing: border-box; background: #0F1A14; color: #F1E9D8; font-family: 'JetBrains Mono', monospace; font-size: 15px; line-height: 1.6\" data-canvas-width=\"1280\" data-canvas-height=\"7300\" data-document-role=\"page\" data-label=\"Pickled Tomato Dust\">\n\n<div style=\"max-width: 1180px; margin: 0 auto; padding: 24px 32px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between\">\n<div style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: 0.04em; color: #FF5A3C\">PTD<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 28px\">\n<a href=\"#solutions\">Solutions<\u002Fa>\n<a href=\"#method\">Method<\u002Fa>\n<a href=\"#contact\">Contact<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width: 1180px; margin: 0 auto; padding: 96px 32px 88px; box-sizing: border-box\">\n<div style=\"color: #8DBF5A; font-weight: 700; letter-spacing: 0.12em; font-size: 13px; margin-bottom: 24px\">[ SECURE. SEASONED. SHELF-STABLE. ]<\u002Fdiv>\n<h1 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(48px, 9vw, 120px); line-height: 0.95; letter-spacing: -0.02em; color: #F1E9D8\">PICKLED TOMATO DUST<\u002Fh1>\n<h2 style=\"margin: 28px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 500; font-size: clamp(24px, 3.4vw, 40px); color: #FF5A3C\">cybersecurity solutions<\u002Fh2>\n<p style=\"margin: 28px 0 0; max-width: 620px; font-size: 17px; color: #D4CBB8\">We do not stop breaches. We cure them, grind them down and sprinkle them over your network until nobody can tell what went wrong.<\u002Fp>\n<div style=\"margin-top: 40px; display: flex; flex-wrap: wrap; gap: 16px\">\n<a href=\"#contact\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 28px; background: #FF5A3C; color: #0F1A14; font-weight: 700; border-radius: 4px\">Book a brining<\u002Fa>\n<a href=\"#solutions\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 28px; border: 1px solid #F1E9D8; border-radius: 4px\">See solutions<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"border-top: 1px solid #2A3B30; border-bottom: 1px solid #2A3B30; background: #14231A\">\n<div style=\"max-width: 1180px; margin: 0 auto; padding: 14px 32px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 12px 40px; font-size: 13px; color: #A9B8A3\">\n<span>THREAT LEVEL: MILDLY TANGY<\u002Fspan>\n<span>PICKLE INTEGRITY: NOMINAL<\u002Fspan>\n<span>DUST PARTICLES IN SUSPENSION: YES<\u002Fspan>\n<span>LAST BREACH: PROBABLY LUNCH<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width: 1180px; margin: 0 auto; padding: 72px 32px 8px; box-sizing: border-box\">\n<div style=\"font-size: 13px; color: #8DBF5A; font-weight: 700; letter-spacing: 0.12em; margin-bottom: 32px\">[ OUR NUMBERS (WE CHECKED THEM TWICE, ONCE BY EYE) ]<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 32px\">\n<div>\n<div style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 64px; line-height: 1; color: #FF5A3C\">100%<\u002Fdiv>\n<p style=\"margin: 8px 0 0; color: #D4CBB8\">of breaches we failed to detect did not, as far as we know, happen.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 64px; line-height: 1; color: #FF5A3C\">0<\u002Fdiv>\n<p style=\"margin: 8px 0 0; color: #D4CBB8\">known incidents since we stopped keeping the incident log.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 64px; line-height: 1; color: #FF5A3C\">After lunch<\u002Fdiv>\n<p style=\"margin: 8px 0 0; color: #D4CBB8\">mean time to respond, subject to lunch.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 64px; line-height: 1; color: #FF5A3C\">9 of 10<\u002Fdiv>\n<p style=\"margin: 8px 0 0; color: #D4CBB8\">auditors agreed to stop asking questions after the free sample.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 48px; padding-top: 24px; border-top: 1px solid #2A3B30; display: flex; flex-wrap: wrap; gap: 12px 32px; font-size: 13px; color: #A9B8A3\">\n<span>AS FEATURED IN:<\u002Fspan>\n<span>Jar Weekly<\u002Fspan>\n<span>The Daily Brine<\u002Fspan>\n<span>Condiment Security Quarterly<\u002Fspan>\n<span>A napkin someone left on a table<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-top: 72px; border-top: 1px solid #2A3B30; border-bottom: 1px solid #2A3B30; background: #14231A; padding: 20px 0 16px\">\n<div style=\"max-width: 1180px; margin: 0 auto 14px; padding: 0 32px; box-sizing: border-box; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: #8DBF5A\">[ OUR PARTNERS ]<\u002Fdiv>\n<div style=\"overflow: hidden; width: 100%\">\n<div class=\"ptd-marquee\" style=\"display: flex; width: max-content; animation: ptd-marquee 36s linear infinite\">\n<div style=\"display: flex; flex-shrink: 0; white-space: nowrap; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; color: #F1E9D8\">\n<span style=\"margin-right: 56px\">SWEET CHESTNUT FRUIT CAKE LTD*<\u002Fspan>\n<span style=\"margin-right: 56px; color: #FF5A3C\">◆<\u002Fspan>\n<span style=\"margin-right: 56px\">SWEET CHESTNUT FRUIT CAKE LTD*<\u002Fspan>\n<span style=\"margin-right: 56px; color: #FF5A3C\">◆<\u002Fspan>\n<span style=\"margin-right: 56px\">SWEET CHESTNUT FRUIT CAKE LTD*<\u002Fspan>\n<span style=\"margin-right: 56px; color: #FF5A3C\">◆<\u002Fspan>\n<span style=\"margin-right: 56px\">SWEET CHESTNUT FRUIT CAKE LTD*<\u002Fspan>\n<span style=\"margin-right: 56px; color: #FF5A3C\">◆<\u002Fspan>\n<\u002Fdiv>\n<div aria-hidden=\"true\" style=\"display: flex; flex-shrink: 0; white-space: nowrap; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; color: #F1E9D8\">\n<span style=\"margin-right: 56px\">SWEET CHESTNUT FRUIT CAKE LTD*<\u002Fspan>\n<span style=\"margin-right: 56px; color: #FF5A3C\">◆<\u002Fspan>\n<span style=\"margin-right: 56px\">SWEET CHESTNUT FRUIT CAKE LTD*<\u002Fspan>\n<span style=\"margin-right: 56px; color: #FF5A3C\">◆<\u002Fspan>\n<span style=\"margin-right: 56px\">SWEET CHESTNUT FRUIT CAKE LTD*<\u002Fspan>\n<span style=\"margin-right: 56px; color: #FF5A3C\">◆<\u002Fspan>\n<span style=\"margin-right: 56px\">SWEET CHESTNUT FRUIT CAKE LTD*<\u002Fspan>\n<span style=\"margin-right: 56px; color: #FF5A3C\">◆<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"max-width: 1180px; margin: 14px auto 0; padding: 0 32px; box-sizing: border-box; font-size: 13px; color: #A9B8A3\">* Sweet Chestnut Fruit Cake Ltd is a subsidiary of PTD.<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"solutions\" style=\"max-width: 1180px; margin: 0 auto; padding: 72px 32px 24px; box-sizing: border-box\">\n<h3 style=\"margin: 0 0 40px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 500; font-size: 28px; color: #8DBF5A\">solutions include:<\u002Fh3>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px\">\n\n<div style=\"padding: 32px; border: 1px solid #2A3B30; border-radius: 8px; background: #14231A; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"font-size: 13px; color: #8DBF5A; font-weight: 700\">01 / DECEPTION<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1\">PTD-Pit honeypot<\u002Fh3>\n<p style=\"margin: 0; color: #D4CBB8\">A fake network so appetizing that attackers forget why they came. Every login attempt is logged, jarred and labelled with a handwritten date.<\u002Fp>\n<div style=\"margin-top: auto; padding-top: 12px; font-size: 13px; color: #A9B8A3\">Contents may settle during transit.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding: 32px; border: 1px solid #2A3B30; border-radius: 8px; background: #14231A; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"font-size: 13px; color: #8DBF5A; font-weight: 700\">02 / OPERATING SYSTEM<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1\">FS food oS for maximal food consumption<\u002Fh3>\n<p style=\"margin: 0; color: #D4CBB8\">A hardened operating system with one kernel-level priority: snacks. Scheduler, filesystem and firewall all yield to a sandwich.<\u002Fp>\n<div style=\"margin-top: auto; padding-top: 12px; font-size: 13px; color: #A9B8A3\">Boots faster than you can say second helping.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding: 32px; border: 1px solid #2A3B30; border-radius: 8px; background: #14231A; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"font-size: 13px; color: #8DBF5A; font-weight: 700\">03 / HOSPITALITY<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1\">Hotel management Xmony<\u002Fh3>\n<p style=\"margin: 0; color: #D4CBB8\">Run every room, key card and breakfast buffet from one dashboard. Guests check in, threats check out, and the minibar stays encrypted.<\u002Fp>\n<div style=\"margin-top: auto; padding-top: 12px; font-size: 13px; color: #A9B8A3\">Late checkout available for malware.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding: 32px; border: 1px solid #2A3B30; border-radius: 8px; background: #14231A; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"font-size: 13px; color: #8DBF5A; font-weight: 700\">04 / PERIMETER<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1\">PTD SaltWall firewall<\u002Fh3>\n<p style=\"margin: 0; color: #D4CBB8\">A firewall made of actual salt. Packets that touch it shrivel and leave. Not recommended for use near slugs.<\u002Fp>\n<div style=\"margin-top: auto; padding-top: 12px; font-size: 13px; color: #A9B8A3\">Humidity may void protection.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding: 32px; border: 1px solid #2A3B30; border-radius: 8px; background: #14231A; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"font-size: 13px; color: #8DBF5A; font-weight: 700\">05 / ZERO TRUST<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1\">Cucumber Zero Trust<\u002Fh3>\n<p style=\"margin: 0; color: #D4CBB8\">Trust no user, no device and especially no cucumber. Every request is verified, brined and then verified again for flavour.<\u002Fp>\n<div style=\"margin-top: auto; padding-top: 12px; font-size: 13px; color: #A9B8A3\">Cucumbers were not consulted.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding: 32px; border: 1px solid #2A3B30; border-radius: 8px; background: #14231A; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"font-size: 13px; color: #8DBF5A; font-weight: 700\">06 / MONITORING<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1\">KaaS: Ketchup-as-a-Service<\u002Fh3>\n<p style=\"margin: 0; color: #D4CBB8\">A SIEM that squeezes your logs onto one plate. Alerts arrive in a bottle you must shake aggressively before reading.<\u002Fp>\n<div style=\"margin-top: auto; padding-top: 12px; font-size: 13px; color: #A9B8A3\">Pairs well with fries and compliance.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding: 32px; border: 1px solid #2A3B30; border-radius: 8px; background: #14231A; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"font-size: 13px; color: #8DBF5A; font-weight: 700\">07 / ENDPOINT<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1\">Antivirus Sourdough<\u002Fh3>\n<p style=\"margin: 0; color: #D4CBB8\">Scans your machines overnight, rises by morning, and sheds a faint smell of yeast on every detected threat.<\u002Fp>\n<div style=\"margin-top: auto; padding-top: 12px; font-size: 13px; color: #A9B8A3\">Starter culture sold separately.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding: 32px; border: 1px solid #2A3B30; border-radius: 8px; background: #14231A; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"font-size: 13px; color: #8DBF5A; font-weight: 700\">08 / IDENTITY<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1\">Two-Factor Gherkin<\u002Fh3>\n<p style=\"margin: 0; color: #D4CBB8\">Authenticate with a password and a small pickle. Lose the pickle and you must prove you are who you say you are, loudly, to a receptionist.<\u002Fp>\n<div style=\"margin-top: auto; padding-top: 12px; font-size: 13px; color: #A9B8A3\">Biometric option: a sniff test.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding: 32px; border: 1px solid #2A3B30; border-radius: 8px; background: #14231A; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"font-size: 13px; color: #8DBF5A; font-weight: 700\">09 / INCIDENT RESPONSE<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1\">The Emergency Ladle<\u002Fh3>\n<p style=\"margin: 0; color: #D4CBB8\">Break glass in case of ransomware. Inside is a ladle. We cannot explain what happens next, but morale improves.<\u002Fp>\n<div style=\"margin-top: auto; padding-top: 12px; font-size: 13px; color: #A9B8A3\">Soup not included.<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"method\" style=\"max-width: 1180px; margin: 0 auto; padding: 96px 32px; box-sizing: border-box\">\n<h2 style=\"margin: 0 0 48px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(32px, 5vw, 56px); line-height: 1; letter-spacing: -0.01em\">The PTD method<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 40px\">\n<div style=\"border-top: 3px solid #FF5A3C; padding-top: 20px\">\n<div style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px\">1. Brine<\u002Fdiv>\n<p style=\"margin: 12px 0 0; color: #D4CBB8\">Submerge your infrastructure in a proprietary vinegar-based threat model for no fewer than six weeks.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border-top: 3px solid #FF5A3C; padding-top: 20px\">\n<div style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px\">2. Dust<\u002Fdiv>\n<p style=\"margin: 12px 0 0; color: #D4CBB8\">Dehydrate, pulverize, and apply evenly across all endpoints. Coverage is measured in pinches.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border-top: 3px solid #FF5A3C; padding-top: 20px\">\n<div style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px\">3. Defend<\u002Fdiv>\n<p style=\"margin: 12px 0 0; color: #D4CBB8\">Attackers sneeze, lose their place, and go home. Our incident response is a polite shrug.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"ptd-scene\" style=\"position: relative; height: 2980px; border-top: 1px solid #2A3B30; border-radius: 4px; width: 1300px\">\n<div style=\"position: sticky; top: 0; height: 680px; box-sizing: border-box; padding: 0 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #0F1A14; overflow: hidden\">\n\n<div style=\"width: 100%; max-width: 880px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.1\">Live demo: defending a server<\u002Fh2>\n<span style=\"font-size: 13px; color: #FF5A3C; opacity: \">scroll to pour ↓<\u002Fspan>\n<\u002Fdiv>\n\n<div style=\"position: relative; width: 100%; max-width: 880px; aspect-ratio: 1000 / 560\">\n<svg viewBox=\"0 0 1000 560\" role=\"img\" aria-label=\"Animation: a jar of pale red dust opens and is poured over a server while hackers are flung away at ridiculous speed\" style=\"position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block\">\n<defs>\n<linearGradient id=\"ptd-coat-dc-static\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n<stop offset=\"0\" stop-color=\"#E8A090\" stop-opacity=\"1\"><\u002Fstop>\n<stop offset=\"1\" stop-color=\"#E8A090\" stop-opacity=\"0.15\"><\u002Fstop>\n<\u002FlinearGradient>\n<g id=\"ptd-hk-dc-static\">\n<path d=\"M -18 0 L -14 -50 Q 0 -74 14 -50 L 18 0 Z\" fill=\"#050806\" stroke=\"#8DBF5A\" stroke-width=\"2\"><\u002Fpath>\n<rect x=\"-8\" y=\"-58\" width=\"5\" height=\"4\" fill=\"#8DBF5A\"><\u002Frect>\n<rect x=\"3\" y=\"-58\" width=\"5\" height=\"4\" fill=\"#8DBF5A\"><\u002Frect>\n<rect x=\"14\" y=\"-34\" width=\"30\" height=\"20\" rx=\"2\" fill=\"#14231A\" stroke=\"#8DBF5A\" stroke-width=\"2\"><\u002Frect>\n<rect x=\"20\" y=\"-29\" width=\"18\" height=\"2\" fill=\"#8DBF5A\"><\u002Frect>\n<rect x=\"20\" y=\"-24\" width=\"12\" height=\"2\" fill=\"#8DBF5A\"><\u002Frect>\n<\u002Fg>\n<g id=\"ptd-trail-dc-static\">\n<line x1=\"34\" y1=\"-52\" x2=\"120\" y2=\"-52\" stroke=\"#F1E9D8\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fline>\n<line x1=\"34\" y1=\"-32\" x2=\"150\" y2=\"-32\" stroke=\"#F1E9D8\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fline>\n<line x1=\"34\" y1=\"-12\" x2=\"110\" y2=\"-12\" stroke=\"#F1E9D8\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fline>\n<\u002Fg>\n<\u002Fdefs>\n\n<line x1=\"0\" y1=\"530\" x2=\"1000\" y2=\"530\" stroke=\"#2A3B30\" stroke-width=\"3\"><\u002Fline>\n\n<rect x=\"430\" y=\"330\" width=\"140\" height=\"200\" rx=\"8\" fill=\"#14231A\" stroke=\" 002Fuse>\n<use href=\"#ptd-trail-dc-static\" style=\"transform: ; opacity: \"><\u002Fuse>\n<use href=\"#ptd-hk-dc-static\" style=\"transform: \"><\u002Fuse>\n<use href=\"#ptd-hk-dc-static\" style=\"transform: \"><\u002Fuse>\n<use href=\"#ptd-hk-dc-static\" style=\"transform: \"><\u002Fuse>\n<use href=\"#ptd-hk-dc-static\" style=\"transform: \"><\u002Fuse>\n\n<g style=\"transform: \">\n<rect x=\"-55\" y=\"-70\" width=\"110\" height=\"140\" rx=\"16\" fill=\"rgba(241,233,216,0.10)\" stroke=\"#F1E9D8\" stroke-width=\"3\"><\u002Frect>\n<rect x=\"-48\" y=\"-62\" width=\"96\" height=\"124\" rx=\"10\" fill=\"#E8A090\" style=\"transform: ; transform-box: fill-box; transform-origin: 50% 100%\"><\u002Frect>\n<rect x=\"-46\" y=\"-90\" width=\"92\" height=\"22\" rx=\"4\" fill=\"rgba(241,233,216,0.10)\" stroke=\"#F1E9D8\" stroke-width=\"3\"><\u002Frect>\n<rect x=\"-34\" y=\"-22\" width=\"68\" height=\"40\" rx=\"4\" fill=\"#F1E9D8\"><\u002Frect>\n<text x=\"0\" y=\"2\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"#0F1A14\" font-family=\"JetBrains Mono, monospace\">PTD<\u002Ftext>\n<text x=\"0\" y=\"14\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#0F1A14\" font-family=\"JetBrains Mono, monospace\">DUST<\u002Ftext>\n<\u002Fg>\n<g style=\"transform: \">\n<rect x=\"-50\" y=\"-9\" width=\"100\" height=\"18\" rx=\"4\" fill=\"#FF5A3C\"><\u002Frect>\n<\u002Fg>\n\n<g style=\"transform: ; opacity: \">\n<rect x=\"-120\" y=\"-26\" width=\"240\" height=\"52\" rx=\"4\" fill=\"#0F1A14\" stroke=\"#FF5A3C\" stroke-width=\"4\"><\u002Frect>\n<text x=\"0\" y=\"8\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#FF5A3C\" font-family=\"JetBrains Mono, monospace\">ACCESS DENIED<\u002Ftext>\n<\u002Fg>\n<\u002Fsvg>\n\n<div style=\"position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none\">\n\n<div style=\"position: absolute; left: ; top: ; width: ; height: ; margin: 0; border-radius: 50%; background: #E8A090; opacity: ; filter: ; transform: translate(-50%, -50%)\"><\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"width: 100%; max-width: 880px\">\n<div style=\"font-size: 13px; font-weight: 700; color: #8DBF5A\">{{stage}}<\u002Fdiv>\n<div style=\"margin-top: 4px; font-size: 16px; color: #D4CBB8; min-height: 52px\">{{caption}}<\u002Fdiv>\n<div style=\"margin-top: 8px; height: 3px; background: #2A3B30\"><div style=\"height: 3px; background: #FF5A3C; width: \"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background: #14231A; border-top: 1px solid #2A3B30; border-bottom: 1px solid #2A3B30\">\n<div style=\"max-width: 1180px; margin: 0 auto; padding: 88px 32px; box-sizing: border-box\">\n<h2 style=\"margin: 0 0 12px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(32px, 5vw, 56px); line-height: 1; letter-spacing: -0.01em\">Feedback from entities that cannot sue<\u002Fh2>\n<p style=\"margin: 0 0 48px; color: #A9B8A3\">Invented for this page. Any resemblance to a satisfied customer is a coincidence.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px\">\n<div style=\"padding: 28px; border: 1px solid #2A3B30; border-radius: 8px; background: #0F1A14\">\n<p style=\"margin: 0; font-size: 17px; color: #F1E9D8\">We were hacked for years and never noticed. Then PTD arrived and now we notice a faint tang.<\u002Fp>\n<div style=\"margin-top: 20px; font-size: 13px; color: #8DBF5A\">A cucumber, Head of Security, Cucumber Holdings<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 28px; border: 1px solid #2A3B30; border-radius: 8px; background: #0F1A14\">\n<p style=\"margin: 0; font-size: 17px; color: #F1E9D8\">I asked for a penetration test and received a pickle. Honestly, it found everything.<\u002Fp>\n<div style=\"margin-top: 20px; font-size: 13px; color: #8DBF5A\">A hotel manager, who prefers to remain a raccoon<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 28px; border: 1px solid #2A3B30; border-radius: 8px; background: #0F1A14\">\n<p style=\"margin: 0; font-size: 17px; color: #F1E9D8\">Our compliance officer wept openly during the demo. We assume it was joy.<\u002Fp>\n<div style=\"margin-top: 20px; font-size: 13px; color: #8DBF5A\">Gerald, certified by Gerald<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width: 1180px; margin: 0 auto; padding: 96px 32px; box-sizing: border-box\">\n<h2 style=\"margin: 0 0 40px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(32px, 5vw, 56px); line-height: 1; letter-spacing: -0.01em\">Questions people ask us<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px 48px\">\n<div>\n<div style=\"font-weight: 700; color: #FF5A3C\">Is it secure?<\u002Fdiv>\n<p style=\"margin: 8px 0 0; color: #D4CBB8\">Define secure. Define is. Please stop asking.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-weight: 700; color: #FF5A3C\">Do you support cloud environments?<\u002Fdiv>\n<p style=\"margin: 8px 0 0; color: #D4CBB8\">We support all weather conditions, including partial cloud, light drizzle and brine.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-weight: 700; color: #FF5A3C\">Why is the dust pickled?<\u002Fdiv>\n<p style=\"margin: 8px 0 0; color: #D4CBB8\">Fresh dust has a short shelf life and poor compliance posture.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-weight: 700; color: #FF5A3C\">Who is your CISO?<\u002Fdiv>\n<p style=\"margin: 8px 0 0; color: #D4CBB8\">A jar on the third shelf. It has never once been phished.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"contact\" style=\"background: #FF5A3C; color: #0F1A14\">\n<div style=\"max-width: 1180px; margin: 0 auto; padding: 72px 32px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 32px; align-items: center; justify-content: space-between\">\n<div style=\"max-width: 640px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(30px, 4.4vw, 52px); line-height: 1.02\">Your network called. It wants seasoning.<\u002Fh2>\n<p style=\"margin: 16px 0 0; font-size: 16px\">Talk to a representative who is definitely not a raccoon in a suit.<\u002Fp>\n<\u002Fdiv>\n<a href=\"#contact\" style=\"display: inline-flex; align-items: center; min-height: 52px; padding: 0 32px; background: #0F1A14; color: #F1E9D8; font-weight: 700; border-radius: 4px\">Request a demo<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width: 1180px; margin: 0 auto; padding: 40px 32px 56px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; font-size: 13px; color: #A9B8A3\">\n<span>Pickled Tomato Dust. A fictional company. Please do not rely on it to protect anything.<\u002Fspan>\n<span>Satire. No tomatoes were secured in the making of this page.<\u002Fspan>\n<span style=\"flex-basis: 100%\">Fine print: PTD makes no guarantees, warranties or promises, and wishes you a pleasant afternoon. Results may vary, spoil or be sold at a farmers market. Terms and conditions are written on the underside of a lid.<\u002Fspan>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FF5A3C&quot;,&quot;options&quot;:[&quot;#FF5A3C&quot;,&quot;#E8B93A&quot;,&quot;#8DBF5A&quot;,&quot;#F28FAD&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:7300}}\">\nclass Component extends DCLogic {\ncomponentDidMount() {\nlet reduce = false;\ntry { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}\nif (reduce) { this.setState({ p: 1 }); return; }\nthis._raf = 0;\nthis._last = -1;\nthis._update = () => {\nthis._raf = 0;\nconst el = document.getElementById('ptd-scene');\nif (!el) return;\nconst r = el.getBoundingClientRect();\nconst range = Math.max(1, r.height - 680);\nconst p = Math.min(1, Math.max(0, -r.top / range));\nif (Math.abs(p - this._last) > 0.0015) { this._last = p; this.setState({ p: p }); }\n};\nthis._onScroll = () => { if (!this._raf) this._raf = requestAnimationFrame(this._update); };\nwindow.addEventListener('scroll', this._onScroll, true);\nwindow.addEventListener('resize', this._onScroll);\nthis._update();\n}\ncomponentWillUnmount() {\nif (this._onScroll) {\nwindow.removeEventListener('scroll', this._onScroll, true);\nwindow.removeEventListener('resize', this._onScroll);\n}\n}\nrenderVals() {\nconst p = (this.state && this.state.p) || 0;\nconst clamp = (x) => Math.min(1, Math.max(0, x));\nconst seg = (v, a, b) => clamp((v - a) / (b - a));\nconst ease = (t) => t * t * (3 - 2 * t);\nconst f = (n) => n.toFixed(2);\nconst out = { accent: this.props.accent ?? '#FF5A3C' };\n\nconst e = ease(seg(p, 0.04, 0.20));\nout.lidT = 'translate(' + f(440 + 300 * e) + 'px, ' + f(54 - 40 * e - 380 * e * e) + 'px) rotate(' + f(900 * e) + 'deg)';\n\nconst tl = ease(seg(p, 0.20, 0.40));\nconst wob = (p > 0.40 && p < 0.64) ? Math.sin(p * 500) * 1.2 : 0;\nout.jarT = 'translate(440px, ' + f(150 - 20 * tl) + 'px) rotate(' + f(135 * tl + wob) + 'deg)';\nout.jarFillT = 'scaleY(' + (1 - 0.88 * seg(p, 0.36, 0.62)).toFixed(3) + ')';\n\nconst m = seg(p, 0.46, 0.74);\nout.moundT = 'translate(500px, 333px) scale(' + f(0.2 + 0.8 * m) + ', ' + f(0.2 + 0.8 * m) + ')';\nout.moundO = f(Math.min(1, m * 1.5) * 0.85);\nout.coatO = f(seg(p, 0.5, 0.8) * 0.65);\n\nconst ss = ease(seg(p, 0.80, 0.88));\nout.stampT = 'translate(500px, 455px) rotate(-8deg) scale(' + f(1.6 - 0.6 * ss) + ')';\nout.stampO = f(ss);\n\nconst particles = [];\nconst N = 30;\nfor (let i = 0; i < N; i++) {\nconst s1 = ((i * 7919) % 97) / 97;\nconst s2 = ((i * 104729) % 89) / 89;\nconst spawn = 0.34 + (i / N) * 0.26;\nconst t = seg(p, spawn, spawn + 0.10 + s1 * 0.04);\nconst x = 502 + (s1 - 0.5) * 30 + (s2 - 0.5) * 110 * t;\nconst y = 192 + 144 * Math.pow(t, 1.5);\nparticles.push({ left: f(x / 10) + '%', top: f(y / 5.6) + '%', size: f(4 + s1 * 5) + 'px', opacity: (t > 0 && t < 1) ? '0.9' : '0', filter: 'none' });\n}\nfor (let i = 0; i < 10; i++) {\nconst s1 = ((i * 6151) % 83) / 83;\nconst s2 = ((i * 9973) % 79) / 79;\nconst spawn = 0.46 + i * 0.025;\nconst t = seg(p, spawn, spawn + 0.14);\nconst x = 500 + (s1 * 2 - 1) * 130 * t;\nconst y = 322 - 45 * Math.sin(Math.PI * t) * s2;\nparticles.push({ left: f(x / 10) + '%', top: f(y / 5.6) + '%', size: f(16 + s2 * 16) + 'px', opacity: (t > 0 && t < 1) ? f(0.55 * (1 - t)) : '0', filter: 'blur(3px)' });\n}\nout.particles = particles;\n\nconst cfg = [\n{ side: -1, sx: -40, nx: 330, d: 0.00 },\n{ side: -1, sx: -170, nx: 255, d: 0.02 },\n{ side: 1, sx: 1040, nx: 670, d: 0.01 },\n{ side: 1, sx: 1170, nx: 745, d: 0.03 }\n];\ncfg.forEach((c, i) => {\nconst a = ease(seg(p, 0.02 + 0.02 * i, 0.32 + 0.02 * i));\nconst rs = 0.62 + c.d;\nconst t = seg(p, rs, rs + 0.18);\nconst bob = (a < 1 && t === 0) ? Math.abs(Math.sin(p * 90 + i * 2)) * 5 : 0;\nconst shake = (p > 0.5 && t === 0) ? Math.sin(p * 420 + i) * 3 : 0;\nconst x = c.sx + (c.nx - c.sx) * a + c.side * Math.pow(t, 3) * 1700 + shake;\nconst y = 530 - bob - t * t * 240;\nconst dir = -c.side;\nconst spin = c.side * 1440 * t * t;\nout['h' + i + 'b'] = 'translate(' + f(x) + 'px, ' + f(y) + 'px) scale(' + (dir * 1.25) + ', 1.25) rotate(' + f(spin) + 'deg)';\nout['h' + i + 't'] = 'translate(' + f(x) + 'px, ' + f(y) + 'px) scale(' + (dir * 1.25) + ', 1.25)';\nout['h' + i + 'o'] = (t > 0.03 && t < 1) ? '0.9' : '0';\n});\n\nconst stages = [\n[0.0, '01 / UNSCREW', 'Unscrew the jar. It is stiff. That is the freshness.'],\n[0.2, '02 / TILT', 'Tilt toward the server. Gently. Then less gently.'],\n[0.4, '03 / POUR', 'Pour the dust. Pale red, fine as flour, strongly opinionated.'],\n[0.62, '04 / REPEL', 'Hackers detect the dust and feel an urgent need to be elsewhere.'],\n[0.82, '05 / SEASONED', 'Access denied. The server is seasoned. Nothing further is required.']\n];\nlet st = stages[0];\nfor (let i = 0; i < stages.length; i++) { if (p >= stages[i][0]) st = stages[i]; }\nout.stage = st[1];\nout.caption = st[2];\nout.barW = f(p * 100) + '%';\nout.hintO = f(1 - seg(p, 0, 0.05));\nreturn out;\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
